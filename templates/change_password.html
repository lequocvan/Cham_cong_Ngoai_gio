{% extends "base.html" %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 25px; color: #2c3e50;">
        <i class="fas fa-key"></i> Đổi mật khẩu
    </h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Mật khẩu hiện tại</label>
            <input type="password" name="old_password" class="form-control" required 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Mật khẩu mới</label>
            <input type="password" name="new_password" class="form-control" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-refresh" style="flex: 1; border: none; padding: 12px; background: #3498db; color: white; border-radius: 6px; cursor: pointer; font-weight: bold;">
                Cập nhật mật khẩu
            </button>
            <a href="{{ url_for('index') }}" style="flex: 1; text-align: center; text-decoration: none; padding: 12px; background: #95a5a6; color: white; border-radius: 6px; font-weight: bold;">
                Hủy bỏ
            </a>
        </div>
    </form>
</div>
{% endblock %}
