{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center py-5">
            <i class="fas fa-paper-plane fa-4x text-info mb-4"></i>
            <h3>Gửi Báo Cáo Lỗi CSV</h3>
            <p>Bấm nút bên dưới để bắt đầu gửi mail cho các đơn vị đã khai báo.</p>
            
            <form method="POST">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-envelope"></i> Bắt đầu gửi ngay
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
