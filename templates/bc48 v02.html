{% extends "base.html" %}

{% block title %}Hệ thống nạp dữ liệu BC48 (TXT; CSV){% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between" style="background: #2c3e50; color: white;">
            <h6 class="m-0 font-weight-bold"><i class="fas fa-file-upload mr-2"></i>1. Nạp dữ liệu điện tử TXT (CTR, DWT, EFT, PTR)</h6>
        </div>
        <div class="card-body">
            <form action="{{ url_for('import_bc48_files') }}" method="POST" enctype="multipart/form-data" id="uploadFormTxt">
                <div class="form-group">
                    <label class="font-weight-bold text-dark">Chọn các tệp tin .txt nguồn:</label>
                    <div class="custom-file">
                        <input type="file" name="files[]" class="custom-file-input" id="customFileTxt" multiple accept=".txt" required>
                        <label class="custom-file-label text-truncate" for="customFileTxt" data-browse="Chọn file">Chưa chọn tệp nào...</label>
                    </div>
                </div>
                
                <div id="progressContainerTxt" class="mt-4" style="display:none;">
                    <div class="card border-left-info shadow-sm">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                        Đang xử lý: <span id="currentFileName" class="text-dark font-weight-bold">...</span>
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">
                                        <span id="rowCount">0</span> / <span id="totalCount">0</span> dòng
                                    </div>
                                </div>
                                <div class="col-auto"><i class="fas fa-database fa-2x text-gray-300"></i></div>
                            </div>
                            <div class="progress mt-3" style="height: 20px;">
                                <div id="realProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 0%;">0%</div>
                            </div>
                            <div id="statusMessage" class="small font-italic text-muted mt-2 text-center"></div>
                        </div>
                    </div>
                </div>
                
                <div class="text-right mt-3">
                    <button type="submit" class="btn btn-primary px-5 shadow-sm" id="btnSubmitTxt">
                        <i class="fas fa-upload mr-1"></i> Thực hiện nạp TXT
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3" style="background: #c0392b; color: white;">
            <h6 class="m-0 font-weight-bold"><i class="fas fa-exclamation-triangle mr-2"></i>2. Nạp dữ liệu CSV (Lỗi Cục PCRT)</h6>
        </div>
        <div class="card-body">
            <form action="{{ url_for('import_bc48_csv') }}" method="POST" enctype="multipart/form-data" id="uploadFormCsv">
                <div class="form-group">
                    <label class="font-weight-bold text-danger">Chọn các tệp tin .csv:</label>
                    <div class="custom-file">
                        <input type="file" name="files[]" class="custom-file-input" id="customFileCsv" multiple accept=".csv" required>
                        <label class="custom-file-label text-truncate" for="customFileCsv" data-browse="Chọn file">Chọn CSV...</label>
                    </div>
                </div>
                <div class="text-right mt-3">
                    <button type="submit" class="btn btn-danger px-5 shadow-sm" id="btnSubmitCsv">
                        <i class="fas fa-file-import mr-1"></i> Thực hiện nạp CSV
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // 1. Sửa lỗi không hiển thị tên file khi chọn
    $('.custom-file-input').on('change', function() {
        let files = this.files;
        let label = $(this).next('.custom-file-label');
        if (files.length > 1) {
            label.html(files.length + ' tệp đã chọn');
        } else if (files.length === 1) {
            label.html(files[0].name);
        } else {
            label.html('Chưa chọn tệp nào...');
        }
    });

    // 2. Xử lý nạp TXT
    $('#uploadFormTxt').on('submit', function(e) {
        e.preventDefault();
        const $btn = $('#btnSubmitTxt');
        const $container = $('#progressContainerTxt');
        const formData = new FormData(this);

        $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Đang khởi tạo...');
        $container.show();
        
        window.onbeforeunload = function() { return "Đang nạp dữ liệu, vui lòng không đóng trình duyệt!"; };

        fetch($(this).attr('action'), { method: 'POST', body: formData })
        .then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = ""; 

            function processText({ done, value }) {
                if (done) {
                    $('#statusMessage').html('<b class="text-success"><i class="fas fa-check-circle"></i> Toàn bộ tệp đã được nạp thành công!</b>');
                    window.onbeforeunload = null;
                    setTimeout(() => location.reload(), 1500);
                    return;
                }

                buffer += decoder.decode(value, { stream: true });
                let lines = buffer.split('\n\n');
                buffer = lines.pop(); // Giữ lại phần chưa hoàn chỉnh vào buffer

                lines.forEach(line => {
                    let cleanLine = line.trim();
                    if (cleanLine.startsWith('data: ')) {
                        try {
                            let data = JSON.parse(cleanLine.substring(6));
                            
                            if (data.status === 'start') {
                                $('#currentFileName').text(data.filename);
                                $('#totalCount').text(data.total.toLocaleString());
                                $('#realProgressBar').css('width', '0%').text('0%');
                                $('#rowCount').text('0');
                            } 
                            else if (data.status === 'progress') {
                                let current = data.current;
                                let total = parseInt($('#totalCount').text().replace(/,/g, ''));
                                $('#rowCount').text(current.toLocaleString());
                                if (total > 0) {
                                    let pct = Math.round((current / total) * 100);
                                    $('#realProgressBar').css('width', pct + '%').attr('aria-valuenow', pct).text(pct + '%');
                                }
                            } 
                            else if (data.status === 'error') {
                                $('#statusMessage').append('<div class="text-danger small mt-1">⚠️ ' + data.msg + '</div>');
                            }
                        } catch (err) {
                            console.error("Lỗi phân tích JSON:", err, cleanLine);
                        }
                    }
                });
                return reader.read().then(processText);
            }
            return reader.read().then(processText);
        })
        .catch(err => {
            window.onbeforeunload = null;
            alert("Lỗi kết nối server: " + err.message);
            $btn.prop('disabled', false).text('Thực hiện nạp lại');
        });
    });

    // 3. Xử lý nạp CSV (Xử lý thông thường)
    $('#uploadFormCsv').on('submit', function(e) {
        e.preventDefault();
        const $btn = $('#btnSubmitCsv');
        const formData = new FormData(this);
        $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Đang nạp CSV...');
        
        fetch($(this).attr('action'), { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success && data.success.length > 0) alert("Nạp thành công CSV.");
            if (data.error && data.error.length > 0) alert("Lỗi CSV: " + data.error.join(", "));
            location.reload();
        })
        .catch(err => {
            alert("Lỗi nạp CSV: " + err);
            $btn.prop('disabled', false).text('Nạp lại CSV');
        });
    });
});
</script>
{% endblock %}
