repos:
  # 1. Tự động định dạng code theo chuẩn Black
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  # 2. Kiểm tra tuân thủ quy chuẩn PEP 8 với Flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # 3. Kiểm tra bảo mật mã nguồn Python với Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "-ll", "-ii"]
        exclude: ^tests/

  # 4. Kiểm tra lỗ hổng thư viện phụ thuộc với Safety
  - repo: https://github.com/pyupio/safety-git-hook
    rev: v0.0.6
    hooks:
      - id: safety